<title>Conflict Atlas</title>

<meta name="description" content="Tap a country or conflict zone for a short brief and the best public expert analysis from CFR, Crisis Group and other think tanks.">

<style>
/* Layout: one working screen. The map is the index, the briefing panel is the page:
   map above the panel on a phone, beside it on a wide screen. Paper is a cool grey-blue
   like a diplomatic map sheet; dispatch blue is the one accent; status colours are data
   (CFR's own ratings), never decoration. */
:root {
  --paper: #EDF0F3;
  --surface: #FAFBFC;
  --ink: #16202B;
  --muted: #536070;
  --faint: #7A8593;
  --rule: #D3D9E0;
  --rule-soft: #E3E7EC;
  --sea: #DCE3EA;
  --land: #F8F9FA;
  --border: #B9C3CE;
  --grat: #C9D2DC;
  --accent: #1D4E89;
  --accent-wash: #DCE6F2;
  --worse: #B42318;
  --dev: #6941C6;
  --same: #A15C07;
  --better: #067647;
  --fill-mix: 46%;
  --shadow: 0 1px 2px rgba(22,32,43,.12), 0 4px 14px rgba(22,32,43,.08);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --prose: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F151C; --surface: #151D26; --ink: #E5EAF0; --muted: #A0ABB8; --faint: #76818E;
    --rule: #26313D; --rule-soft: #1F2933; --sea: #0B1117; --land: #1C2631; --border: #33404E; --grat: #18212B;
    --accent: #8DB8EE; --accent-wash: #1C2D42;
    --worse: #F97066; --dev: #B692F6; --same: #F5B54A; --better: #4FCB8D; --fill-mix: 52%;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F151C; --surface: #151D26; --ink: #E5EAF0; --muted: #A0ABB8; --faint: #76818E;
  --rule: #26313D; --rule-soft: #1F2933; --sea: #0B1117; --land: #1C2631; --border: #33404E; --grat: #18212B;
  --accent: #8DB8EE; --accent-wash: #1C2D42;
  --worse: #F97066; --dev: #B692F6; --same: #F5B54A; --better: #4FCB8D; --fill-mix: 52%;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.s-worse { --st: var(--worse); } .s-dev { --st: var(--dev); } .s-same { --st: var(--same); } .s-better { --st: var(--better); }

/* frame */
.app { height: 100%; display: grid; grid-template-areas: "top" "map" "panel"; grid-template-rows: auto minmax(220px, 44%) minmax(0, 1fr); }
@media (min-width: 900px) {
  .app { grid-template-areas: "top top" "map panel"; grid-template-columns: minmax(0, 1fr) minmax(380px, 34%); grid-template-rows: auto minmax(0, 1fr); }
}
.top { grid-area: top; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 12px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.mark { margin: 0; font-size: 15px; font-weight: 800; font-stretch: 125%; letter-spacing: .07em; text-transform: uppercase; line-height: 1.1; }
.mark span { color: var(--worse); }
.asof { font-size: 12px; font-weight: 600; font-stretch: 75%; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

/* map */
.mapwrap { grid-area: map; position: relative; overflow: hidden; background: var(--sea); touch-action: none; -webkit-user-select: none; user-select: none; }
#map { display: block; width: 100%; height: 100%; }
.sphere { fill: var(--sea); }
.grat { fill: none; stroke: var(--grat); stroke-width: .6; vector-effect: non-scaling-stroke; }
.land path { fill: var(--land); stroke: var(--border); stroke-width: .5; vector-effect: non-scaling-stroke; stroke-linejoin: round; cursor: pointer; transition: fill .15s; }
.land path[class*="s-"] { fill: color-mix(in srgb, var(--st) var(--fill-mix), var(--land)); }
.land path.inv { fill: color-mix(in srgb, var(--ink) 9%, var(--land)); }
@media (hover: hover) { .land path:hover { fill: color-mix(in srgb, var(--accent) 22%, var(--land)); } .land path[class*="s-"]:hover { fill: color-mix(in srgb, var(--st) 70%, var(--land)); } }
.land path.sel { stroke: var(--accent); stroke-width: 2.2; }
.mk { cursor: pointer; }
.mk .hit { fill: transparent; }
.mk .ring { fill: var(--surface); stroke: var(--st); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.mk .dot { fill: var(--st); }
.mk .pulse { fill: none; stroke: var(--st); stroke-width: 1.4; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
.mk.on .ring { stroke: var(--accent); stroke-width: 2.6; }
@keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
.zoomctl { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface); }
.zoomctl button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); }
.zoomctl button + button { border-top: 1px solid var(--rule); }
.zoomctl svg { width: 18px; height: 18px; }
.key { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 10px; display: none; gap: 12px; padding: 7px 11px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: var(--shadow); font-size: 12px; font-weight: 600; font-stretch: 87.5%; color: var(--muted); }
@media (min-width: 900px) { .key { display: flex; } }
.key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--st); margin-right: 5px; vertical-align: 0; }
.tip { position: absolute; pointer-events: none; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--paper); font-size: 12.5px; font-weight: 600; white-space: nowrap; transform: translate(-50%, -130%); }

/* panel */
.panel { grid-area: panel; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-top: 1px solid var(--rule); }
@media (min-width: 900px) { .panel { border-top: 0; border-left: 1px solid var(--rule); } }
.inner { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 22px; max-width: 700px; }
.lab { margin: 0 0 8px; font-size: 12px; font-weight: 650; font-stretch: 75%; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lab small { font-size: inherit; font-weight: 500; letter-spacing: .06em; color: var(--faint); margin-left: 6px; }
.lede { margin: 0; font-family: var(--prose); font-size: 17px; line-height: 1.45; max-width: 60ch; text-wrap: pretty; }
.prose { margin: 0; font-family: var(--prose); font-size: 17px; line-height: 1.52; max-width: 62ch; text-wrap: pretty; }
h2.ttl { margin: 0; font-size: 25px; line-height: 1.12; font-weight: 750; font-stretch: 92%; letter-spacing: -.005em; text-wrap: balance; }
h3.sub { margin: 0; font-size: 19px; line-height: 1.2; font-weight: 700; font-stretch: 92%; text-wrap: balance; }
.eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 650; font-stretch: 75%; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.note { margin: 6px 0 0; font-size: 14px; color: var(--muted); }

.search { position: relative; }
.search input { width: 100%; min-height: 46px; padding: 0 14px 0 40px; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); font-size: 16px; outline: none; }
.search input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.search svg { position: absolute; left: 13px; top: 14px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.sugg { list-style: none; margin: 6px 0 0; padding: 4px 0; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.sugg button { display: flex; justify-content: space-between; gap: 12px; width: 100%; min-height: 42px; padding: 0 14px; align-items: center; }
.sugg button:hover, .sugg button:focus-visible { background: var(--accent-wash); outline: none; }
.sugg small { color: var(--muted); font-size: 12.5px; font-stretch: 87.5%; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--st); }
.legend .al i { background: none; border: 1.6px solid var(--worse); }

.group + .group { margin-top: 18px; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-soft); }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: start; width: 100%; padding: 11px 0; border-bottom: 1px solid var(--rule-soft); }
.row .sw { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--st); }
.row .t { display: block; font-size: 15.5px; font-weight: 620; line-height: 1.3; }
.row .c { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
.row .chev { width: 16px; height: 16px; margin-top: 3px; color: var(--faint); }
@media (hover: hover) { .row:hover .t { color: var(--accent); } }

.back { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; min-height: 40px; margin-block: -8px -12px; padding-right: 8px; color: var(--accent); font-weight: 620; }
.back svg { width: 16px; height: 16px; }

.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px 0 8px; border-radius: 13px; font-size: 12.5px; font-weight: 650; font-stretch: 87.5%; background: color-mix(in srgb, var(--st, var(--ink)) 13%, transparent); color: var(--st, var(--ink)); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.plain { --st: var(--muted); }
.pill.alert { --st: var(--worse); background: transparent; box-shadow: inset 0 0 0 1.5px var(--worse); }
.pill.alert i { background: none; box-shadow: inset 0 0 0 1.6px currentColor; }

.brief { display: flex; flex-direction: column; gap: 18px; }
.brief + .brief { padding-top: 22px; border-top: 1px solid var(--rule); }
.places { display: flex; flex-wrap: wrap; gap: 6px; }
.place { min-height: 32px; padding: 0 11px; border-radius: 16px; background: var(--paper); font-size: 13.5px; font-weight: 600; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.place.inv { color: var(--muted); }

.start { display: grid; gap: 8px; }
@media (min-width: 560px) and (max-width: 899px) { .start { grid-template-columns: 1fr 1fr; } }
.src { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule); color: var(--ink); text-decoration: none; }
.src b { display: block; font-size: 15px; font-weight: 700; }
.src span { display: block; margin-top: 1px; font-size: 13px; color: var(--muted); }
.src svg { width: 16px; height: 16px; color: var(--accent); }
@media (hover: hover) { .src:hover { box-shadow: inset 0 0 0 1.5px var(--accent); } }

.reads { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-soft); }
.reads a { display: block; padding: 10px 0 11px; border-bottom: 1px solid var(--rule-soft); color: var(--ink); text-decoration: none; }
.reads .who { display: block; font-size: 11.5px; font-weight: 700; font-stretch: 75%; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.reads .who em { font-style: normal; font-weight: 500; letter-spacing: .05em; color: var(--faint); margin-left: 6px; }
.reads .rt { display: block; margin-top: 2px; font-family: var(--prose); font-size: 16px; line-height: 1.35; text-wrap: pretty; }
@media (hover: hover) { .reads a:hover .rt { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 17px; font-size: 13.5px; font-weight: 600; color: var(--ink); text-decoration: none; box-shadow: inset 0 0 0 1px var(--rule); }
@media (hover: hover) { .chip:hover { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); } }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--faint); }

.party { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-soft); }

.about { padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13px; line-height: 1.5; color: var(--muted); }
.about p { margin: 0; max-width: 62ch; }
.about p + p { margin-top: 8px; }

@media (prefers-reduced-motion: reduce) { .mk .pulse { animation: none; opacity: 0; } .land path { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top gut">
    <h1 class="mark">Conflict<span>·</span>Atlas</h1>
    <span class="asof" id="asof"></span>
  </header>

  <div class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="World map. Conflict zones are shaded by status; tap a country or marker for its brief.">
      <g id="vp">
        <path class="sphere" id="sphere"></path>
        <path class="grat" id="grat"></path>
        <g class="land" id="land"></g>
        <g id="marks"></g>
      </g>
    </svg>
    <div class="key" aria-hidden="true">
      <span class="s-worse"><i></i>Worsening</span>
      <span class="s-dev"><i></i>Developing</span>
      <span class="s-same"><i></i>Unchanging</span>
      <span class="s-better"><i></i>Improving</span>
    </div>
    <div class="zoomctl">
      <button type="button" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button type="button" id="zreset" aria-label="Show the whole map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.3 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.3-3.8-8.5s1.2-6.1 3.8-8.5z"/></svg></button>
    </div>
    <div class="tip" id="tip" hidden></div>
  </div>

  <main class="panel" id="panel" aria-live="polite">
    <div class="inner gut" id="view"></div>
  </main>
</div>

ing peace, while Zelenskyy said the waiver would hurt Ukraine. Strikes continue on both sides, Ukraine has made small gains near Oleksandrivka according to the Institute for the Study of War, and Russia has stepped up attacks on Black Sea shipping.","watch":"Whether the November talks happen and get past territory and security guarantees. Also watch strains between Kyiv and Washington, winter attacks on energy infrastructure, and Europe’s debate over using frozen Russian assets.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine","icg":"https://www.crisisgroup.org/europe-central-asia/eastern-europe/ukraine","reads":[["Crisis Group","Ukraine under Strain: The Choices Facing the EU","15 Oct 2026","https://www.crisisgroup.org/cmt/europe/european-union-ukraine-russia/ukraine-under-strain-choices-facing-eu"],["Chatham House","After Trump’s Russian diesel deal, will Europe give Ukraine the support it needs?","15 Oct 2026","https://www.chathamhouse.org/2026/10/after-trumps-russian-diesel-deal-will-europe-give-ukraine-support-it-needs"],["Crisis Group","The Changing Role of Nuclear Weapons in Europe","13 Oct 2026","https://www.crisisgroup.org/rpt/europe/europe-russia-ukraine-united-states/273-changing-role-nuclear-weapons-europe"],["RUSI","Russia’s Aggression in Ukraine Will Persist Through 2026","","https://www.rusi.org/explore-our-research/publications/commentary/russias-aggression-ukraine-will-persist-through-2026"],["CSIS","The Geography of Coercion: Russian Missile and Drone Campaigns in Ukraine","","https://www.csis.org/analysis/geography-coercion-russian-missile-and-drone-campaigns-ukraine"]],"pt":[575.6,72.7]},{"id":"armenia-azerbaijan","name":"Tensions Between Armenia and Azerbaijan","region":"Europe and Eurasia","status":"Improving","impact":"Low","where":["051","031"],"involved":[],"marker":[46.4,40],"term":"Armenia Azerbaijan peace","background":"Azerbaijan’s September 2023 offensive retook Nagorno-Karabakh, and more than 100,000 ethnic Armenians fled. A US-brokered summit in August 2025 produced a joint declaration and an initialled peace agreement.","latest":"Signing the treaty depends on Armenia removing territorial claims from its constitution, which is tied to a referendum expected in 2027. A US-backed transit route across southern Armenia is due to start construction, and Armenia held parliamentary elections in June 2026.","watch":"The constitutional referendum, the transit corridor, and Russia’s efforts to keep its influence in Armenia.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/nagorno-karabakh-conflict","icg":"https://www.crisisgroup.org/europe-central-asia/caucasus/nagorno-karabakh-conflict","reads":[["IISS","Armenia’s election and peace in the South Caucasus","Jun 2026","https://www.iiss.org/online-analysis/online-analysis/2026/06/armenias-election-and-peace-in-the-south-caucasus/"],["Carnegie","Rewiring the South Caucasus: TRIPP and the New Geopolitics of Connectivity","Mar 2026","https://carnegieendowment.org/research/2026/03/rewiring-the-south-caucasus-tripp-and-the-new-geopolitics-of-connectivity"],["Crisis Group","Issues of War and Peace Gain Top Billing in Armenia’s Election","2 Jun 2026","https://www.crisisgroup.org/qna/europe/armenia/issues-war-and-peace-gain-top-billing-armenias-election"],["ECFR","How Europeans can support the south Caucasus’s last democracy","","https://ecfr.eu/article/how-europeans-can-support-the-south-caucasuss-last-democracy/"]],"pt":[616.4,99.9]},{"id":"iran","name":"Conflict With Iran","region":"Middle East and North Africa","status":"Worsening","impact":"High","where":["364"],"involved":["376","840"],"marker":[53.5,32.4],"alert":true,"term":"Iran war ceasefire","background":"The United States and Israel attacked Iran from 28 February 2026, killing Supreme Leader Ali Khamenei and striking nuclear and military sites. The fighting widened into a regional war and disrupted shipping through the Strait of Hormuz.","latest":"A Pakistan-mediated interim deal in June paused major hostilities, but it has largely unravelled at sea, and the Strait of Hormuz is close to shut to commercial traffic. On 22 October Iran’s Revolutionary Guard said it had hit four ships using a US-backed route; President Trump accused Tehran of staging incidents to push up oil prices. Brent crude rose above $117 on 23 October, its highest since March. The US says it can keep its blockade of Iranian ports going indefinitely; an Iranian envoy said Tehran would reopen the strait if the blockade were lifted, which Iranian state media then denied. Saudi, Turkish and Pakistani officials were due in Tehran on 26 October for de-escalation talks.","watch":"Crisis Group flags a risk of renewed escalation in October. President Trump says he is weighing a deal against new strikes to “finish” Iran, and that any strikes would wait until after the 3 November US midterm elections.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran","icg":"https://www.crisisgroup.org/middle-east-north-africa/gulf-and-arabian-peninsula/iran","reads":[["CFR","Will the United States Attack Iran After the Midterms?","23 Oct 2026","https://cfr.org/articles/will-the-united-states-attack-iran-after-the-midterms"],["Crisis Group","How War is Reshaping Iran’s “Axis of Resistance”","16 Oct 2026","https://www.crisisgroup.org/cmt/middle-east-north-africa/iran/how-war-reshaping-irans-axis-resistance"],["Crisis Group","Five Energy Market Factors That Could Tip the Scales in the Middle East War","1 Oct 2026","https://www.crisisgroup.org/cmt/united-states/united-states-iran-israelpalestine/five-energy-market-factors-could-tip-scales-middle-east-war"],["CSIS","Bunker Busters: Deep Targets, Shallow Stocks","15 Oct 2026","https://www.csis.org/analysis/bunker-busters-deep-targets-shallow-stocks"],["Chatham House","Will the US–Iran ceasefire hold?","Jun 2026","https://www.chathamhouse.org/2026/06/will-us-iran-ceasefire-hold"]],"pt":[640.1,125.7]},{"id":"israel-palestine","name":"Israeli-Palestinian Conflict","region":"Middle East and North Africa","status":"Unchanging","impact":"Medium","where":["376","275"],"involved":[],"marker":[34.9,31.6],"term":"Gaza Israel Palestine","background":"Hamas’s attack on 7 October 2023 killed about 1,200 people in Israel and took some 250 hostages. Israel’s war in Gaza that followed has killed more than 70,000 Palestinians, according to Gaza’s health authorities, and displaced almost the entire population. An October 2025 ceasefire brought home all remaining hostages.","latest":"A Hamas disarmament agreement announced by the US-led Board of Peace in July 2026 has not been carried out: Hamas wants Israeli forces to withdraw first, and Israel has blocked parts of the plan for an international stabilisation force, which has yet to deploy. Israel still holds around 60 percent of Gaza, and Al Jazeera reports more than 1,400 Palestinians killed there since the ceasefire; Israel says its strikes target Hamas. Settler attacks and Israeli military raids in the West Bank continue.","watch":"Israel votes in a general election on 27 October, and coalition-building could take weeks. Then watch whether the next government and Hamas can agree the order of disarmament and withdrawal.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict","icg":"https://www.crisisgroup.org/middle-east-north-africa/east-mediterranean-mena/israelpalestine","reads":[["Crisis Group","Israel’s Elections: What’s at Stake?","15 Oct 2026","https://www.crisisgroup.org/qna/middle-east-north-africa/israelpalestine/israels-elections-whats-stake"],["Crisis Group","Hollow Promises: Resetting Gaza’s Ceasefire","24 Aug 2026","https://www.crisisgroup.org/rpt/middle-east-north-africa/israelpalestine-united-states/257-hollow-promises-resetting-gazas-ceasefire"],["Chatham House","By agreeing to disarm, Hamas is trying to call Israel’s bluff in Gaza","Aug 2026","https://www.chathamhouse.org/2026/08/agreeing-disarm-hamas-trying-call-israels-bluff-gaza"],["ECFR","Decommission, not disarm: How Europe can help nudge Gaza toward peace","","https://ecfr.eu/article/decommission-not-disarm-how-europe-can-help-nudge-gaza-toward-peace/"],["CSIS","What Comes Next for Israel-Hamas Ceasefire?","","https://www.csis.org/analysis/what-comes-next-israel-hamas-ceasefire"]],"pt":[591.7,128.5]},{"id":"lebanon","name":"Conflict With Hezbollah in Lebanon","region":"Middle East and North Africa","status":"Unchanging","impact":"Medium","where":["422"],"involved":["376"],"marker":[35.9,33.9],"term":"Lebanon Hezbollah Israel","background":"Hezbollah began firing on Israel in October 2023, and Israel’s 2024 campaign badly weakened the group. Fighting resumed during the 2026 Iran war, and an Israeli ground invasion in March 2026 left Israel holding about a fifth of Lebanon.","latest":"The June interim deal was meant to end Israel–Hezbollah fighting. A US-brokered framework ties Israeli withdrawal to Hezbollah disarming, which the group rejects. Lebanon and Israel have held several rounds of direct talks. US-hosted military talks at CENTCOM headquarters in Tampa on about 21 October lasted six hours without a breakthrough; Lebanese reports say how to verify Hezbollah’s disarmament was the main obstacle. Israeli strikes continue in the south.","watch":"Whether the Lebanese army can take control of the south, and what follows the UN peacekeeping mission (UNIFIL), whose mandate ends in December 2026. Irish troops serve with UNIFIL.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/political-instability-lebanon","icg":"https://www.crisisgroup.org/middle-east-north-africa/east-mediterranean-mena/lebanon","reads":[["Crisis Group","Toward Lasting Stability in Lebanon","15 Oct 2026","https://www.crisisgroup.org/cmt/europe/european-union-lebanon-israelpalestine/toward-lasting-stability-lebanon"],["Carnegie","Lebanon Should Try to Place Hezbollah on the U.S.-Iran Table","Jun 2026","https://carnegieendowment.org/middle-east/diwan/2026/06/lebanon-should-place-hezbollah-on-the-us-iran-table"],["CSIS","Beyond the Rome Talks: Pilot Zones, Hezbollah, and Rebuilding State Authority in South Lebanon","","https://www.csis.org/analysis/beyond-rome-talks-pilot-zones-hezbollah-and-rebuilding-state-authority-south-lebanon"],["Chatham House","Lebanon–Israel talks must be given a chance","Apr 2026","https://www.chathamhouse.org/2026/04/lebanon-israel-talks-must-be-given-chance"]],"pt":[593.3,120.5]},{"id":"yemen","name":"Conflict in Yemen and the Red Sea","region":"Middle East and North Africa","status":"Worsening","impact":"Medium","where":["887"],"involved":["682"],"marker":[43.6,14.6],"alert":true,"term":"Yemen Houthis Red Sea","background":"Yemen’s war between the Houthis and the Saudi-backed government dates to 2014, and a 2022 UN-brokered truce largely froze it. From late 2023 the Houthis attacked Red Sea shipping over the Gaza war, drawing US and UK strikes.","latest":"In September 2026 the Houthis pushed down the Red Sea coast, taking Mocha and reaching the Bab al-Mandab strait. Their missile and drone war on Saudi Arabia has intensified: a strike on Riyadh’s main airport on 10 October killed 13 people, and Houthi-claimed attacks killed 17 in Saudi Arabia in October, according to The National. In the week to 26 October the Houthis claimed hits on Saudi airports, oil pumping stations and a pipeline; Riyadh says it intercepted missiles aimed at Riyadh, Yanbu and Taif, and the Saudi-led coalition says it destroyed launchers in Sanaa. Riyadh airport partly reopened on 25 October.","watch":"Crisis Group warns of further escalation in October, with risks for the Gulf states and for shipping through one of the world’s main chokepoints. Saudi talks with Iran in Tehran, alongside Turkey and Pakistan, are a test of whether Riyadh can lower the temperature.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/war-yemen","icg":"https://www.crisisgroup.org/middle-east-north-africa/gulf-and-arabian-peninsula/yemen","reads":[["CSIS","Avoiding Another Long War in Yemen","15 Oct 2026","https://www.csis.org/analysis/avoiding-another-long-war-yemen"],["Crisis Group","Yemen’s War Moves toward Zero-sum Confrontation","14 Oct 2026","https://www.crisisgroup.org/qna/middle-east-north-africa/yemen-saudi-arabia-iran/yemens-war-moves-toward-zero-sum-confrontation"],["Chatham House","The Yemen war is not just Saudi Arabia’s problem. It’s the Gulf’s too","Oct 2026","https://www.chathamhouse.org/2026/10/yemen-war-not-just-saudi-arabias-problem-its-gulfs-too"],["Carnegie","The Impacts of the Houthis’ Advance Could Extend Well Beyond Saudi Arabia","Sep 2026","https://carnegieendowment.org/emissary/2026/09/houthis-bab-al-mandeb-impacts-saudi-arabia-somaliland"],["ECFR","The Saudi dilemma: How Yemen could shape the next phase of the Iran war","","https://ecfr.eu/article/the-saudi-dilemma-how-yemen-could-shape-the-next-phase-of-the-iran-war/"]],"pt":[621.5,190.4]},{"id":"syria","name":"Instability in Syria","region":"Middle East and North Africa","status":"Unchanging","impact":"Low","where":["760"],"involved":[],"marker":[38.5,35],"term":"Syria transition","background":"Bashar al-Assad’s government fell in December 2024 after more than 13 years of civil war. Ahmed al-Sharaa, whose Islamist-rooted group led the final offensive, heads a transitional government.","latest":"The transition is fragile. Bringing Kurdish-led forces into the national army, protecting minorities after deadly reprisals, constitutional reform and a security arrangement with Israel are all unresolved. Fresh clashes broke out in Druze-majority Suwayda in September.","watch":"The Kurdish integration deal, and whether reprisal violence against minorities can be curbed.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/conflict-syria","icg":"https://www.crisisgroup.org/middle-east-north-africa/east-mediterranean-mena/syria","reads":[["Crisis Group","A Pivotal Moment in Uniting Post-Assad Syria","17 Sep 2026","https://www.crisisgroup.org/cmt/middle-east-north-africa/syria/pivotal-moment-uniting-post-assad-syria"],["Crisis Group","Curbing Reprisals in Syria","24 Aug 2026","https://www.crisisgroup.org/cmt/middle-east-north-africa/syria/curbing-reprisals-syria"],["Carnegie","An Army of “Sons of the Regions”: Syria’s Post-Assad Military Order","Jun 2026","https://carnegieendowment.org/middle-east/research/2026/06/an-army-of-sons-of-the-regions-syrias-post-assad-military-order"],["CSIS","How Syria Can Succeed in Integrating the Kurds","","https://www.csis.org/analysis/how-syria-can-succeed-integrating-kurds"]],"pt":[599.5,116.7]},{"id":"iraq","name":"Instability in Iraq","region":"Middle East and North Africa","status":"Unchanging","impact":"Low","where":["368"],"involved":[],"marker":[43.8,33.2],"term":"Iraq militias","background":"More than two decades after the US invasion, Iraq still faces Islamic State sleeper cells, over a million displaced people, and powerful Iran-aligned armed groups outside full state control.","latest":"The US-led anti-ISIS coalition is leaving. The new prime minister faced a September 2026 deadline to disarm pro-Iran militias, amid US and Israeli strikes on those groups.","watch":"Reform of the Popular Mobilisation Forces, and whether Iraq can stay out of the wider Iran conflict.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/political-instability-iraq","icg":"https://www.crisisgroup.org/middle-east-north-africa/gulf-and-arabian-peninsula/iraq","reads":[["Crisis Group","The U.S.-led Anti-ISIS Coalition is Leaving Iraq: What Happens Next?","29 Sep 2026","https://www.crisisgroup.org/cmt/middle-east-north-africa/iraq-united-states/us-led-anti-isis-coalition-leaving-iraq-what-happens-next"],["Carnegie","Iraq’s Disarmament Path Begins with Reform of the PMF","Sep 2026","https://carnegieendowment.org/middle-east/diwan/2026/09/iraqs-disarmament-path-begins-with-pmf-reform"],["Chatham House","Can Iraq’s new prime minister finally rein in its armed factions?","Jun 2026","https://www.chathamhouse.org/2026/06/can-iraqs-new-prime-minister-finally-rein-its-armed-factions"]],"pt":[614.2,122.9]},{"id":"libya","name":"Instability in Libya","region":"Middle East and North Africa","status":"Unchanging","impact":"Low","where":["434"],"involved":[],"marker":[17.5,27.5],"term":"Libya","background":"Since Muammar Qadhafi’s fall in 2011, Libya has been split between rival authorities in Tripoli in the west and Khalifa Haftar’s forces in the east. A 2020 ceasefire ended large-scale fighting.","latest":"Elections remain postponed because the rival camps cannot agree on a unified government. A new US initiative is pushing a power-sharing deal. Saif al-Islam Qadhafi was killed in February 2026.","watch":"Whether the US plan wins over both camps.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/civil-war-libya","icg":"https://www.crisisgroup.org/middle-east-north-africa/north-africa/libya","reads":[["Crisis Group","Assessing the New U.S. Initiative for Libya","20 Aug 2026","https://www.crisisgroup.org/brf/middle-east-north-africa/libya-united-states/b98-assessing-new-us-initiative-libya"],["Chatham House","Why US plans for power-sharing in Libya will not work","Jul 2026","https://www.chathamhouse.org/2026/07/why-us-plans-power-sharing-libya-will-not-work"],["ECFR","Spoiler alert: How Europe can save diplomacy in Libya","","https://ecfr.eu/publication/spoiler-alert-how-europe-can-save-diplomacy-in-libya/"]],"pt":[546.9,143]},{"id":"turkey-kurds","name":"Conflict Between Turkey and Armed Kurdish Groups","region":"Middle East and North Africa","status":"Improving","impact":"Low","where":["792"],"involved":["368","760"],"marker":[40.5,38.2],"term":"Turkey PKK peace process","background":"The PKK’s insurgency against the Turkish state began in 1984 and has cost tens of thousands of lives. In 2025 the group announced it would disarm and dissolve, following a call from its jailed founder Abdullah Öcalan.","latest":"Crisis Group says the peace process remained on track in September. Kurdish parties say Ankara has been slow to deliver the political and legal reforms they were promised.","watch":"Legal reforms in Ankara, and the knock-on effects for Kurdish groups in Syria and Iraq.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/conflict-between-turkey-and-armed-kurdish-groups","icg":"https://www.crisisgroup.org/europe-central-asia/western-europemediterranean/turkey","reads":[["RUSI","After the PKK: Peacebuilding Challenges in Turkey, Syria","","https://www.rusi.org/explore-our-research/publications/commentary/after-pkk-peacebuilding-challenges-turkey-syria"],["Carnegie","What’s Behind the Monumental Shift Between Türkiye and the PKK","Mar 2025","https://carnegieendowment.org/emissary/2025/03/turkey-pkk-disarm-disband-impact-explainer"],["Brookings","Turkey’s search for a Middle East order","","https://www.brookings.edu/articles/turkeys-search-for-a-middle-east-order/"]],"pt":[602.8,105.9]},{"id":"sudan","name":"Civil War in Sudan","region":"Sub-Saharan Africa","status":"Worsening","impact":"Low","where":["729"],"involved":[],"marker":[30.2,14.5],"term":"Sudan war","background":"War between Sudan’s army and the paramilitary Rapid Support Forces (RSF) broke out in April 2023 and has become one of the world’s worst humanitarian crises. The army has retaken Khartoum. The RSF holds most of Darfur, where attacks on non-Arab communities have led to accusations of genocide.","latest":"The army has regained momentum in Kordofan: it secured the road from the capital to El-Obeid in July and took the RSF stronghold of al-Mazroub in North Kordofan on 2 October. Army chief Abdel Fattah al-Burhan rejected talks on 6 October and vowed to retake all RSF-held territory. Both sides are relying on drones: the UN human rights office says drone strikes by the army and the RSF killed at least 306 people in the first three weeks of October, including at least 139 when a truck was hit near Dibab in West Kordofan on 18 October and more than 80 at a market in the disputed Abyei area on 19 October.","watch":"Whether the army pushes into West Kordofan and Darfur, famine conditions, and the pressure on neighbouring Chad and South Sudan.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/power-struggle-sudan","icg":"https://www.crisisgroup.org/africa/horn-africa/sudan","reads":[["Crisis Group","Inside Sudan’s War (podcast)","1 Oct 2026","https://www.crisisgroup.org/pod/africa/sudan/inside-sudans-war"],["CFR","Failure to Act in Sudan (Again)","","https://www.cfr.org/articles/failure-to-act-in-sudan-again"],["ISS Africa","Sudan’s civil war exposes a paralysed multilateral system","","https://issafrica.org/iss-today/sudan-s-civil-war-exposes-a-paralysed-multilateral-system"],["Chatham House","After three years of war, Sudan’s civilians need stronger support","Apr 2026","https://www.chathamhouse.org/2026/04/after-three-years-war-sudans-civilians-need-stronger-support"],["ECFR","Sudan: A war Europe cannot stop, but cannot ignore","","https://ecfr.eu/article/sudan-a-war-europe-cannot-stop-but-cannot-ignore/"]],"pt":[584.2,190.8]},{"id":"ethiopia","name":"Conflict in Ethiopia","region":"Sub-Saharan Africa","status":"Worsening","impact":"Low","where":["231"],"involved":["232"],"marker":[39.5,12.5],"alert":true,"term":"Ethiopia Tigray Eritrea","background":"The 2020–22 war in Tigray killed hundreds of thousands and ended with the Pretoria agreement. Federal authority in Tigray eroded from 2025, while the Fano militia in Amhara and the Oromo Liberation Army kept fighting.","latest":"In September the Tigray People’s Liberation Front (TPLF) joined a seven-group alliance with Fano and the OLA that aims to oust Prime Minister Abiy Ahmed, and launched an offensive. Federal forces hit back and retook Mekelle and other towns in October, and on 16 October Abiy appointed a caretaker council to run Tigray and prepare elections. Fighting continues in central and western Tigray, and Tigrayan forces have reportedly retaken some areas near the Eritrean border that federal troops left. Ethiopia and Eritrea cut diplomatic ties on 1 October; on 19 October Abiy warned Eritrea of “severe consequences” for backing rebels, which Asmara denies.","watch":"Crisis Group’s October alert: a real risk of war between Ethiopia and Eritrea, as Ethiopian heavy weapons are reported moving toward the border.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/conflict-ethiopia","icg":"https://www.crisisgroup.org/africa/horn-africa/ethiopia","reads":[["Crisis Group","Pulling Ethiopia and Eritrea Back from War","12 Oct 2026","https://www.crisisgroup.org/alr/africa/ethiopia-eritrea/pulling-ethiopia-and-eritrea-back-war"],["Crisis Group","Containing the New War in Northern Ethiopia","15 Oct 2026","https://www.crisisgroup.org/cmt/europe/european-union-ethiopia-eritrea-sudan/containing-new-war-northern-ethiopia"],["Chatham House","War has returned to Tigray. This time it may not stay in Ethiopia","Oct 2026","https://www.chathamhouse.org/2026/10/war-has-returned-tigray-time-it-may-not-stay-ethiopia"],["CSIS","The Battle of Mekelle and Its Implications for Ethiopia","","https://www.csis.org/analysis/battle-mekelle-and-its-implications-ethiopia"],["ECFR","Back from the brink: How European support could prevent another Ethiopia-Eritrea war","","https://ecfr.eu/article/back-from-the-brink-how-european-support-could-prevent-another-ethiopia-eritrea-war/"]],"pt":[610.6,198.3]},{"id":"drc","name":"Conflict in the Democratic Republic of Congo","region":"Sub-Saharan Africa","status":"Worsening","impact":"Low","where":["180"],"involved":["646"],"marker":[28.6,-1.6],"term":"DR Congo M23 Rwanda","background":"Eastern Congo has suffered decades of conflict over land, minerals and the legacy of the 1994 Rwandan genocide. Rwanda-backed M23 rebels seized the cities of Goma and Bukavu in early 2025, and more than seven million people are displaced.","latest":"A US-brokered DRC–Rwanda deal and Qatar-mediated talks with M23 have not been carried out on key points, and fighting continues. On 13 October former president Joseph Kabila launched a new political-military coalition with M23, with himself at its head; the government says he is preparing a general attack on the country, which Kabila denies. Drone and artillery fire continues, especially in South Kivu. Government–M23 talks in Qatar are expected in November, and an Ebola outbreak has added to the crisis.","watch":"Whether Rwandan troops withdraw, and whether the DRC’s national dialogue gets anywhere.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/violence-democratic-republic-congo","icg":"https://www.crisisgroup.org/africa/central-africa/democratic-republic-congo","reads":[["Crisis Group","Ex-President Kabila Leads Rebel Cause as Conflict Smoulders in Eastern DRC","14 Oct 2026","https://www.crisisgroup.org/anb/africa/democratic-republic-congo-rwanda/ex-president-kabila-leads-rebel-cause-conflict-smoulders-eastern-drc"],["Chatham House","What can DRC’s national dialogue achieve?","Sep 2026","https://www.chathamhouse.org/2026/09/what-can-drcs-national-dialogue-achieve"],["ISS Africa","Why minerals-for-security deals won’t save the DRC","","https://issafrica.org/iss-today/why-minerals-for-security-deals-won-t-save-the-drc"],["CFR","DRC Fighting Surges Despite Peace Deal","","https://www.cfr.org/articles/drc-fighting-surges-despite-peace-deal"]],"pt":[581,251.9]},{"id":"somalia","name":"Conflict With Al-Shabaab in Somalia","region":"Sub-Saharan Africa","status":"Unchanging","impact":"Low","where":["706"],"involved":["somaliland"],"marker":[45.3,3.5],"term":"Somalia al-Shabaab","background":"Al-Shabaab, an al-Qaeda affiliate, has fought Somalia’s government since the mid-2000s and controls large rural areas. A government offensive launched in 2022 stalled.","latest":"The African Union mission faces collapse as US logistical support ends after December 2026, and aid cuts have raised the risk of famine. Al-Shabaab has deepened its ties with Yemen’s Houthis.","watch":"A tense end-of-year handover as the AU mission draws down.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/al-shabab-somalia","icg":"https://www.crisisgroup.org/africa/horn-africa/somalia","reads":[["Crisis Group","Somalia Awaits a New Security Order as Mission Drawdown Looms","18 Sep 2026","https://www.crisisgroup.org/cmt/africa/somalia/somalia-awaits-new-security-order-mission-drawdown-looms"],["Crisis Group","New Chapter, Same Stalemate: Somalia’s War with Al-Shabaab","30 Jun 2026","https://www.crisisgroup.org/brf/africa/somalia/b212-new-chapter-same-stalemate-somalias-war-al-shabaab"],["ISS Africa","Rethinking the AU’s Somalia peace mission after US funding cuts","","https://issafrica.org/iss-today/rethinking-the-au-s-somalia-peace-mission-after-us-funding-cuts"],["ECFR","React, rinse, repeat: How Europe can help break Somalia’s cycle of conflict","","https://ecfr.eu/publication/react-rinse-repeat-how-europe-can-help-break-somalias-cycle-of-conflict/"]],"pt":[628.2,232.4]},{"id":"south-sudan","name":"Instability in South Sudan","region":"Sub-Saharan Africa","status":"Worsening","impact":"Low","where":["728"],"involved":[],"marker":[30.5,7.3],"term":"South Sudan","background":"Rivalry between President Salva Kiir and Riek Machar has fuelled war on and off since 2013. The core reforms of the 2018 peace deal, including a unified army, a permanent constitution and elections, were never carried out.","latest":"Machar’s arrest in 2025 collapsed the unity government and renewed fighting that has displaced hundreds of thousands. In September 2026 Kiir dropped the unity government altogether, and the country is edging toward famine.","watch":"Whether regional mediators can halt the slide into full-scale war.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/civil-war-south-sudan","icg":"https://www.crisisgroup.org/africa/horn-africa/south-sudan","reads":[["Crisis Group","South Sudan’s President Jettisons Unity Government and Hardens Grip on Power","29 Sep 2026","https://www.crisisgroup.org/anb/africa/south-sudan/south-sudans-president-jettisons-unity-government-and-hardens-grip-power"],["Crisis Group","Halting South Sudan’s Slide into War","25 Mar 2026","https://www.crisisgroup.org/cmt/africa/south-sudan/halting-south-sudans-slide-war"],["ISS Africa","Credible elections are no longer possible in South Sudan","","https://issafrica.org/iss-today/credible-elections-are-no-longer-possible-in-south-sudan-what-next"]],"pt":[586,218]},{"id":"car","name":"Conflict in the Central African Republic","region":"Sub-Saharan Africa","status":"Unchanging","impact":"Low","where":["140"],"involved":[],"marker":[20.9,6.6],"term":"Central African Republic","background":"Fighting between mostly Muslim Séléka factions and mainly Christian militias has kept the Central African Republic unstable since 2013, and much of the country lies beyond government control.","latest":"The government relies on Russia’s Africa Corps, which is paid partly in mining concessions, as Western partners pull back. The UN peacekeeping mission is leaving some bases while armed groups still hold large areas.","watch":"Whether security gains after the recent elections can be held as the UN draws down.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/violence-central-african-republic","icg":"https://www.crisisgroup.org/africa/central-africa/central-african-republic","reads":[["Crisis Group","Central African Republic: Consolidating Security Gains after the Elections","27 Jan 2026","https://www.crisisgroup.org/qna/africa/central-african-republic-russia-rwanda/centrafrique-apres-les-elections-consolider-les-gains-securitaires"],["RUSI","Russia’s Strategy in the Central African Republic","","https://www.rusi.org/explore-our-research/publications/commentary/russias-strategy-central-african-republic"],["Carnegie","Russia in Africa: Examining Moscow’s Influence and Its Limits","Feb 2026","https://carnegieendowment.org/research/2026/02/russia-role-west-southern-africa-junta-wagner-africa-corps"]],"pt":[559,220.6]},{"id":"sahel","name":"Violent Extremism in the Sahel","region":"Sub-Saharan Africa","status":"Worsening","impact":"Low","where":["466","854","562"],"involved":[],"marker":[0.5,14.8],"term":"Sahel Mali Burkina Faso Niger","background":"Jihadist groups linked to al-Qaeda and the Islamic State have spread across the central Sahel, and the border zone shared by Mali, Burkina Faso and Niger now accounts for more than half of the world’s terrorism deaths. Military governments in all three countries expelled Western forces and turned to Russia.","latest":"Tuareg separatists and al-Qaeda-linked JNIM seized Kidal in northern Mali in April 2026. Malian troops backed by Russian paramilitaries retook the largely deserted town on 6 October, but Crisis Group says this does not change the balance of power. A JNIM attack in September killed at least 100 soldiers at a camp in central Mali. In Niger a special forces mutiny turned into a coup attempt.","watch":"The spread of violence south toward coastal West Africa, including Benin, Togo and Ghana.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/violent-extremism-sahel","icg":"https://www.crisisgroup.org/africa/sahel","reads":[["Crisis Group","Niger Wrestles with the Aftermath of a Military Revolt","8 Oct 2026","https://www.crisisgroup.org/qna/africa/niger/niger-wrestles-aftermath-military-revolt"],["CFR","Mali Is the Linchpin of West Africa—Now It’s Under Jihadist Siege","","https://www.cfr.org/articles/whats-at-stake-in-mali-and-what-comes-next"],["ISS Africa","What next for Mali as Wagner fails to defeat insurgents?","","https://issafrica.org/iss-today/what-next-for-mali-as-wagner-fails-to-defeat-insurgents"],["ECFR","Harmattan hazards: How coastal west Africa can escape the Sahel’s fate","","https://ecfr.eu/publication/harmattan-hazards-how-coastal-west-africa-can-escape-the-sahels-fate/"]],"pt":[501.4,189.6]},{"id":"myanmar","name":"Civil War in Myanmar","region":"Asia","status":"Unchanging","impact":"Low","where":["104"],"involved":[],"marker":[96,21],"term":"Myanmar civil war","background":"The military’s February 2021 coup set off a nationwide civil war that has killed more than 100,000 people and displaced over five million. Resistance groups and ethnic armies hold roughly twice as much territory as the junta.","latest":"After junta-run elections, coup leader Min Aung Hlaing became president in April 2026 under a nominally civilian government that most observers see as cover for military rule. The army has stepped up airstrikes in Rakhine as its ground offensive there stalls.","watch":"The fighting in Rakhine, and China’s role as the main outside power broker.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/rohingya-crisis-myanmar","icg":"https://www.crisisgroup.org/asia/south-east-asia/myanmar","reads":[["Crisis Group","Myanmar Military Steps Up Airstrikes in Rakhine as Ground Offensive Stalls","7 Oct 2026","https://www.crisisgroup.org/anb/asia-pacific/myanmar/myanmar-military-steps-airstrikes-rakhine-ground-offensive-stalls"],["Crisis Group","The Critical Minerals Linking Myanmar’s Civil War to the World","10 Sep 2026","https://www.crisisgroup.org/vis/asia-pacific/myanmar/critical-minerals-linking-myanmars-civil-war-world"],["IISS","War by other means: the Tatmadaw’s transition test","","https://myanmar.iiss.org/analysis/war-by-other-means"],["Chatham House","Myanmar ‘election’ shows the military regime is here to stay","Jan 2026","https://www.chathamhouse.org/2026/01/myanmar-election-shows-military-regime-here-stay-how-should-world-respond"]],"pt":[763.2,166.6]},{"id":"afghanistan-pakistan","name":"Conflict Between Afghanistan and Pakistan","region":"Asia","status":"Unchanging","impact":"Low","where":["004","586"],"involved":[],"marker":[70.6,33.4],"alert":true,"term":"Afghanistan Pakistan Taliban","background":"Pakistan blames a surge in deadly attacks on the Pakistani Taliban (TTP), which it says operates from Afghan soil. The Taliban government in Kabul denies sheltering them. In early 2026 Pakistan struck Taliban military sites and declared itself in open war with Kabul.","latest":"After a three-month lull, militant attacks in Pakistan’s border regions in September prompted new Pakistani airstrikes inside Afghanistan. Moscow-hosted regional talks on 5 October ended without agreement. On 17 October the two sides traded fire for nearly four hours around Kurram and Paktia, each blaming the other. Russia, China and the EU have all urged de-escalation.","watch":"Crisis Group flags a risk of further escalation in October.","cfr":"https://www.cfr.org/global-conflict-tracker/conflict/war-afghanistan","icg":"https://www.crisisgroup.org/asia/south-asia/afghanistan","reads":[["CFR","Why Are the Afghan Taliban and Pakistan in an “Open War”?","","https://www.cfr.org/articles/why-are-the-afghan-taliban-and-pakistan-in-an-open-war"],["Crisis Group","Pakistan: Responding to the Militant Surge on the Afghan Border","27 Feb 2026","https://www.crisisgroup.org/rpt/asia-pacific/pakistan-afghanistan/354-pakistan-responding-militant-surge-afghan-border"],["Crisis Group","Five Years after the Fall of Kabul: The Taliban’s Biggest Test Yet?","18 Aug 2026","https://www.crisisgroup.org/cmt/asia-pacific/afghanistan/five-years-after-fall-kabul-talibans-biggest-test-yet"],["Chatham House","Afghanistan and Pakistan are facing ‘open war’. De-escalation is needed","Mar 2026","https://www.chathamhouse.org/2026/03/afghanistan-and-pakistan-are-facing-open-war-de-escalation-needed"]],"pt":[683.9,122.2]},{"id":"india-pakistan","name":"Conflict Between India and Pakistan","region":"Asia","status":"Unchanging","impact":"Medium","where":[],"involved":["356","586"],"marker":[75.3,34.2],"term":"India Pakistan Kashmir","backgro       var keys = [c.r, c.s];
      if (id === '408' || id === '410') keys.push('korea');
      keys.forEach(function (k) { (D.sources[k] || []).forEach(function (s) { if (!seen[s[1]]) { seen[s[1]] = 1; out.push(s); } }); });
    });
    return out;
  }
  function searchChips(term, ids) {
    var list = D.sources.global.slice(0, 6).concat(regionalSources(ids), D.sources.global.slice(6));
    var seen = {};
    var html = list.filter(function (s) { if (seen[s[1]]) return false; seen[s[1]] = 1; return true; }).map(function (s) {
      var u = 'https://www.google.com/search?q=' + encodeURIComponent(term + ' site:' + s[1]) + '&tbs=qdr:y';
      return '<a class="chip" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>';
    }).join('');
    return '<section><h3 class="lab">Search each think tank</h3><div class="chips">' + html + '</div>' +
      '<p class="hint">Opens a web search of that site for the past 12 months.</p></section>';
  }
  function metaPills(k) {
    var h = '<ul class="meta">' +
      '<li class="pill s-' + k.st + '"><i></i>' + esc(k.status) + '</li>' +
      '<li class="pill plain">Impact on US interests: ' + esc(k.impact) + '</li>';
    if (k.alert) h += '<li class="pill alert" title="Crisis Group CrisisWatch conflict risk alert"><i></i>Crisis Group alert for October</li>';
    return h + '</ul>';
  }
  function placeChips(k) {
    var w = k.where.map(function (id) { return '<button type="button" class="place" data-country="' + esc(id) + '">' + esc(C[id].n) + '</button>'; });
    var v = k.involved.map(function (id) { return '<button type="button" class="place inv" data-country="' + esc(id) + '">' + esc(C[id].n) + '</button>'; });
    return '<div class="places" aria-label="Countries">' + w.concat(v).join('') + '</div>';
  }
  function briefBody(k, headingTag) {
    var title = headingTag === 'h2'
      ? '<h2 class="ttl" tabindex="-1">' + esc(k.name) + '</h2>'
      : '<h3 class="sub">' + esc(k.name) + '</h3>';
    var reads = k.reads.map(function (r) {
      return '<li><a href="' + esc(r[3]) + '" target="_blank" rel="noopener"><span class="who">' + esc(r[0]) +
        (r[2] ? '<em>' + esc(r[2]) + '</em>' : '') + '</span><span class="rt">' + esc(r[1]) + '</span></a></li>';
    }).join('');
    return '<article class="brief">' +
      '<div>' + metaPills(k) + title + '</div>' +
      placeChips(k) +
      '<section><h3 class="lab">Background</h3><p class="prose">' + esc(k.background) + '</p></section>' +
      '<section><h3 class="lab">Latest<small>as of ' + esc(D.asof) + '</small></h3><p class="prose">' + esc(k.latest) + '</p></section>' +
      '<section><h3 class="lab">What to watch</h3><p class="prose">' + esc(k.watch) + '</p></section>' +
      '<section><h3 class="lab">Start here</h3><div class="start">' +
        '<a class="src" href="' + esc(k.cfr) + '" target="_blank" rel="noopener"><div><b>CFR Global Conflict Tracker</b><span>Background, timeline and latest news</span></div>' + ICON.out + '</a>' +
        '<a class="src" href="' + esc(k.icg) + '" target="_blank" rel="noopener"><div><b>International Crisis Group</b><span>Field reports, podcasts and monthly CrisisWatch</span></div>' + ICON.out + '</a>' +
      '</div></section>' +
      '<section><h3 class="lab">Key reads</h3><ul class="reads">' + reads + '</ul></section>' +
      '</article>';
  }
  function backBtn() { return '<button type="button" class="back" data-nav="">' + ICON.back + 'All conflicts</button>'; }
  function row(k, sub) {
    return '<li><button type="button" class="row s-' + k.st + '" data-nav="' + esc(k.id) + '"><span class="sw"></span><span><span class="t">' + esc(k.name) + '</span>' +
      '<span class="c">' + esc(sub) + '</span></span>' + ICON.chev + '</button></li>';
  }
  function about() {
    return '<footer class="about"><p>Status and US-impact ratings are CFR’s. Alerts are from Crisis Group’s CrisisWatch. The short briefs are written by Claude from those trackers and the linked analysis, checked on ' + esc(D.asof) + '. Tap through to read the experts in their own words.</p>' +
      '<p>Map data from Natural Earth. Borders shown do not imply any position on disputed territory.</p></footer>';
  }

  function showHome() {
    highlight([], null); frame(null);
    var counts = {}; D.conflicts.forEach(function (k) { counts[k.st] = (counts[k.st] || 0) + 1; });
    var alerts = D.conflicts.filter(function (k) { return k.alert; }).length;
    var groups = ORDER.map(function (reg) {
      var ks = D.conflicts.filter(function (k) { return k.region === reg; })
        .sort(function (a, b) { return (RANK[b.st] - RANK[a.st]) || ((b.alert ? 1 : 0) - (a.alert ? 1 : 0)); });
      return '<section class="group"><h3 class="lab">' + esc(reg) + '</h3><ul class="rows">' +
        ks.map(function (k) { return row(k, (k.alert ? 'Crisis Group alert · ' : '') + names(k.where.length ? k.where : k.involved)); }).join('') + '</ul></section>';
    }).join('');
    view.innerHTML =
      '<p class="lede">Tap a country or a marker for a short brief and the best public expert analysis on it.</p>' +
      '<div class="search"><label class="sr" for="q">Find a country or conflict</label>' + ICON.find +
      '<input id="q" type="search" autocomplete="off" placeholder="Find a country or conflict"><ul class="sugg" id="sugg" hidden></ul></div>' +
      '<section><h3 class="lab">' + D.conflicts.length + ' conflicts on CFR’s tracker</h3><ul class="legend">' +
        ['worse', 'dev', 'same', 'better'].map(function (s) {
          var label = { worse: 'Worsening', dev: 'Developing', same: 'Unchanging', better: 'Improving' }[s];
          return '<li class="s-' + s + '"><i></i>' + label + ' <b>' + (counts[s] || 0) + '</b></li>';
        }).join('') +
        '<li class="al"><i></i>Crisis Group alert <b>' + alerts + '</b></li></ul></section>' +
      '<div>' + groups + '</div>' + about();
    bindSearch();
  }

  function showConflict(id) {
    var k = K[id];
    var hl = k.where.length ? k.where : k.involved;
    highlight(hl, k.id);
    var box = k.where.length ? union(k.where) : [k.pt[0] - 45, k.pt[1] - 35, k.pt[0] + 45, k.pt[1] + 35];
    frame(box);
    view.innerHTML = backBtn() + briefBody(k, 'h2') + searchChips(k.term, k.where.concat(k.involved)) + about();
    focusTitle();
  }

  function showCountry(c) {
    var where = WHERE[c.id] || [], inv = (INV[c.id] || []).filter(function (x) { return where.indexOf(x) < 0; });
    if (c.id === 'siachen') inv = ['india-pakistan'];
    highlight([c.id], where.length === 1 ? where[0] : null);
    frame(c.b);
    var h = backBtn() +
      '<div><p class="eyebrow">' + esc([c.s || c.r].filter(Boolean).join('')) + '</p><h2 class="ttl" tabindex="-1">' + esc(c.n) + '</h2>' +
      (c.note ? '<p class="note">' + esc(c.note) + '</p>' : '') + '</div>';
    if (where.length) {
      h += '<div>' + where.map(function (id) { return briefBody(K[id], 'h3'); }).join('') + '</div>';
    }
    if (inv.length) {
      h += '<section><h3 class="lab">' + (where.length ? 'Also a party to' : 'A party to') + '</h3><ul class="party rows">' +
        inv.map(function (id) { return row(K[id], 'Conflict zone: ' + names(K[id].where.length ? K[id].where : K[id].involved)); }).join('') + '</ul></section>';
    }
    if (!where.length && !inv.length) {
      h += '<section><p class="prose">Not on CFR’s Global Conflict Tracker. Crisis Group’s monthly CrisisWatch follows more than 70 countries and may still cover it.</p>' +
        '<div class="start" style="margin-top:12px"><a class="src" href="https://www.crisisgroup.org/crisiswatch" target="_blank" rel="noopener"><div><b>CrisisWatch</b><span>This month’s trends and alerts, country by country</span></div>' + ICON.out + '</a></div></section>';
    }
    h += searchChips(c.n, [c.id]) + about();
    view.innerHTML = h;
    focusTitle();
  }

  function focusTitle() {
    panel.scrollTop = 0;
    var t = view.querySelector('h2.ttl');
    if (t && document.activeElement && document.activeElement !== document.body) { try { t.focus({ preventScroll: true }); } catch (e) {} }
  }

  /* search */
  var INDEX = D.conflicts.map(function (k) { return { label: k.name, sub: 'Conflict', hash: k.id, key: (k.name + ' ' + k.term + ' ' + names(k.where)).toLowerCase() }; })
    .concat(D.countries.filter(function (c) { return c.id !== 'siachen'; }).map(function (c) {
      return { label: c.n, sub: WHERE[c.id] ? 'Country · on the tracker' : 'Country', hash: 'country-' + c.slug, key: c.n.toLowerCase(), country: true };
    }));
  function bindSearch() {
    var q = document.getElementById('q'), ul = document.getElementById('sugg');
    function render() {
      var v = q.value.trim().toLowerCase();
      if (!v) { ul.hidden = true; ul.innerHTML = ''; return; }
      var hits = INDEX.filter(function (x) { return x.key.indexOf(v) > -1; })
        .sort(function (a, b) { return (b.label.toLowerCase().indexOf(v) === 0) - (a.label.toLowerCase().indexOf(v) === 0) || ((a.country ? 1 : 0) - (b.country ? 1 : 0)); })
        .slice(0, 8);
      ul.innerHTML = hits.length ? hits.map(function (x) { return '<li><button type="button" data-nav="' + esc(x.hash) + '"><span>' + esc(x.label) + '</span><small>' + esc(x.sub) + '</small></button></li>'; }).join('')
        : '<li><button type="button" disabled><span>No match</span></button></li>';
      ul.hidden = false;
    }
    q.addEventListener('input', render);
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { var b = ul.querySelector('button[data-nav]'); if (b) { e.preventDefault(); nav(b.getAttribute('data-nav')); } }
      if (e.key === 'ArrowDown') { var f = ul.querySelector('button'); if (f) { e.preventDefault(); f.focus(); } }
      if (e.key === 'Escape') { q.value = ''; render(); }
    });
  }

  view.addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]');
    if (b) { nav(b.getAttribute('data-nav')); return; }
    var p = e.target.closest('[data-country]');
    if (p) { var c = C[p.getAttribute('data-country')]; if (c) nav('country-' + c.slug); }
  });

  /* routing: #ukraine for a conflict, #country-ireland for a country */
  function nav(hash) {
    if (('#' + hash) === location.hash || (!hash && !location.hash)) route();
    else location.hash = hash;
  }
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (K[h]) return showConflict(h);
    if (h.indexOf('country-') === 0 && BYSLUG[h.slice(8)]) return showCountry(BYSLUG[h.slice(8)]);
    showHome();
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && location.hash && !(e.target && e.target.id === 'q')) nav('');
  });
  route();
})();
</script>
</body>
</html>
